name: sigeria_campo
description: >
  SIGERIA Campo | módulo de SAT-GeoAI Chocó — captura offline-first de
  afectaciones georreferenciadas (evento, EDAN básico, GIS, medición móvil).
publish_to: "none"
version: 0.1.0-mvp

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Persistencia local offline-first (fuente de verdad en el dispositivo)
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  # Red / sincronización
  http: ^1.2.1
  connectivity_plus: ^6.0.3
  # GIS / mapas offline y GNSS
  maplibre_gl: ^0.26.2
  geolocator: ^12.0.0
  # Sensores (pendiente/inclinación, rumbo) — sección 11 del documento base
  sensors_plus: ^5.0.1
  # Cámara / evidencia — vista en vivo real (funciona igual en Mac/Android/
  # iPhone/navegador vía getUserMedia; el atributo HTML "capture" que usa
  # image_picker en solitario NO abre cámara en navegadores de escritorio,
  # por eso se agrega `camera` para tener una vista en vivo de verdad).
  camera: ^0.12.0
  image_picker: ^1.1.2
  # Utilidades
  uuid: ^4.4.0
  intl: ^0.19.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/matriz_maestra.json
    - assets/mapas_offline/
    - assets/gis/objetos_afectados_demo.geojson
    - assets/branding/logo.png
